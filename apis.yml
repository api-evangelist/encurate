aid: encurate
name: Encurate
description: 'Encurate (encurate.app) is a content-management backend for mobile apps that doubles as
  a publisher of read-only reference-data APIs. Its platform lets developers manage magazine, news and
  press-release content for their apps from one web interface, with image delivery over a CDN. Alongside
  it Encurate operates five public REST APIs distributed exclusively through the RapidAPI marketplace:
  Keto Diet (450+ ketogenic recipes in 11 categories with calorie, fat, carbohydrate and protein values),
  AirplanesDB (commercial aircraft specifications), CatBreedDB and DogBreedDB (cat and dog breed metadata),
  and Weed Strain (cannabis strain type, effect, flavor and origin). All 44 published operations are HTTP
  GET returning JSON, authenticated with a RapidAPI key; there is no write surface, no OpenAPI, no SDK
  and no event surface.'
