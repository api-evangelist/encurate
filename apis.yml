- aid: encurate:encurate-keto-diet-api
  name: Encurate Keto Diet API
  description: Read-only REST API serving over 450 ketogenic diet recipes across 11 categories (drinks,
    smoothies, keto staples and dips, desserts, soups, fish, beef, appetizers, snacks and breakfast) with
    nutritional values — calories, fats, carbohydrates and proteins — returned as floats for in-app calculation.
    Twelve GET operations cover listing, single-recipe lookup, keyword search, category and difficulty
    filters, and numeric range filters on calories, macros, prep time and cook time using Django __lt/__gt
    lookup suffixes. Distributed through RapidAPI; free tier is 50 requests per day.
