source:
- https://rapidapi.com/encurateapi-api/api/keto-diet (endpoint catalog + parameter names, HTTP 200)
- https://rapidapi.com/encurateapi-api/api/catbreeddb, /dogbreeddb, /airplanesdb, /weed-strain1 (HTTP 200)
