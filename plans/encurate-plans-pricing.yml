note: 'Replaces the 2026-05-04 scaffold, which carried invented 1,000/month and 100,000/month tiers. Every
  tier below is read verbatim from a page Encurate publishes: the encurate.app pricing page for the content-management
  platform, and the RapidAPI marketplace listing''s own billingPlans record for each dataset API. Encurate
  distributes all five dataset APIs exclusively through RapidAPI; its own pricing FAQ states ''the other
  metadata is currently available for subscription only through Rapid API''.'
discrepancy: The https://encurate.app/keto_diet_api/ marketing page advertises Basic $0 / 100 requests
  per day and Pro $4 / unlimited requests. The RapidAPI listing that page's own Subscribe buttons link
  to publishes BASIC $0 / 50 requests per day, PRO $2 / 4,000 requests per day and ULTRA $4 / 500,000
  requests per month. The marketing figures are the encurate.app platform plan reused on the dataset page;
  the RapidAPI figures are what a subscriber actually gets. Recorded, not reconciled — only Encurate can
  say which is authoritative.
