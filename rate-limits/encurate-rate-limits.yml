policies:
- name: Throttle on cancellation
  description: 'encurate.app pricing FAQ: ''After cancellation, your API requests will be throttled to 100 per day.'''
  source: https://encurate.app/pricing/
- name: Hard vs soft limits
  description: RapidAPI records each quota as hard (requests rejected once exhausted) or soft (overage billed).
    Only the Keto Diet ULTRA tier is soft, at $0.00005 per additional request.
  source: https://rapidapi.com/encurateapi-api/api/keto-diet
- name: Undocumented backoff
  description: Neither encurate.app nor the RapidAPI listings document a Retry-After header, a backoff strategy,
    or a documented reset window. A client must infer recovery from the RapidAPI proxy headers.
  source: searched — absent from both surfaces
