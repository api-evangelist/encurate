source:
- https://rapidapi.com/encurateapi-api/api/keto-diet — RapidAPI billingPlans + rateLimit records (HTTP 200, 2026-09-06)
- https://rapidapi.com/encurateapi-api/api/airplanesdb (HTTP 200)
- https://rapidapi.com/encurateapi-api/api/catbreeddb (HTTP 200)
- https://rapidapi.com/encurateapi-api/api/dogbreeddb (HTTP 200)
- https://rapidapi.com/encurateapi-api/api/weed-strain1 (HTTP 200)
- https://encurate.app/pricing/ — platform quota + throttle-on-cancellation statement (HTTP 200)
- live unauthenticated probe of https://keto-diet.p.rapidapi.com/ and /categories/ (2026-09-06)
note: Replaces the 2026-05-04 scaffold, whose 10/min, 100/min and 1000/min tiers and X-RateLimit-* header set were
  invented. Encurate serves all five dataset APIs through the RapidAPI proxy, so the enforced limits are the RapidAPI
  plan quotas and the runtime headers are RapidAPI's, not Encurate's own. Every value below is either read from
  the provider's published plan record or observed on a live response.
headers:
  limit: X-RateLimit-Requests-Limit
  remaining: X-RateLimit-Requests-Remaining
  reset: X-RateLimit-Requests-Reset
  retryAfter: null
  policy: null
  note: RapidAPI returns X-RateLimit-Requests-Limit / -Remaining / -Reset on AUTHENTICATED responses only. An unauthenticated
    probe of https://keto-diet.p.rapidapi.com/ on 2026-09-06 returned HTTP 401 with no rate-limit headers, only
    x-rapidapi-version, x-rapidapi-region, x-rapidapi-request-id and x-rapidapi-proxy-response. The header names
    are RapidAPI's documented proxy contract; we could not observe them without a key, so they are recorded as searched
    rather than probed. Encurate publishes no rate-limit header documentation of its own.
responseCodes:
  throttled: 429
  quotaExceeded: 429
  unauthenticated: 401
  observed:
  - url: https://keto-diet.p.rapidapi.com/
    status: 401
    body: '{"message":"Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more info."}'
  - url: https://keto-diet.p.rapidapi.com/categories/
    status: 429
    body: '{"message":"Too many requests"}'
